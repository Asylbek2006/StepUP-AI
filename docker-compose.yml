services:
  # ============ DATABASES ============
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: user_db,university_db,ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

  # ============ MICROSERVICES ============
  user-service:
    build: ./user-service
    ports:
      - "9001:9001"
      - "9101:9101"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/user_db?sslmode=disable
      REDIS_URL: redis:6379
      NATS_URL: nats://nats:4222
      JWT_SECRET: secret-stepup-2026
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: test@gmail.com
      SMTP_PASS: testpass
      GRPC_PORT: "9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  university-service:
    build: ./university-service
    ports:
      - "9002:9002"
      - "9102:9102"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/university_db?sslmode=disable
      GRPC_PORT: "9002"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    ports:
      - "9003:9003"
      - "9103:9103"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_db?sslmode=disable
      NATS_URL: nats://nats:4222
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GRPC_PORT: "9003"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    ports:
      - "8081:8080"
      - "9110:9100"
    environment:
      USER_SERVICE_ADDR: user-service:9001
      UNIVERSITY_SERVICE_ADDR: university-service:9002
      AI_SERVICE_ADDR: ai-service:9003
      JWT_SECRET: secret-stepup-2026
      HTTP_PORT: "8080"
    depends_on:
      - user-service
      - university-service
      - ai-service

  # ============ OBSERVABILITY ============
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ../observability/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
