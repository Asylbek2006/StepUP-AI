syntax = "proto3";
package ai;
option go_package = "github.com/stepup-ai/proto/ai";

service AIService {
  rpc AnalyzeAdmissionChances(AnalyzeAdmissionChancesRequest) returns (AnalyzeAdmissionChancesResponse);
  rpc GenerateRoadmap(GenerateRoadmapRequest) returns (GenerateRoadmapResponse);
  rpc ReviewEssay(ReviewEssayRequest) returns (ReviewEssayResponse);
  rpc MatchGrants(MatchGrantsRequest) returns (MatchGrantsResponse);
  rpc GetAnalysisHistory(GetAnalysisHistoryRequest) returns (GetAnalysisHistoryResponse);
  rpc GetRoadmapByUserID(GetRoadmapByUserIDRequest) returns (GetRoadmapByUserIDResponse);
  rpc GetEssayReviewsByUserID(GetEssayReviewsByUserIDRequest) returns (GetEssayReviewsByUserIDResponse);
  rpc GetEssayReviewByID(GetEssayReviewByIDRequest) returns (GetEssayReviewByIDResponse);
  rpc DeleteAnalysis(DeleteAnalysisRequest) returns (DeleteAnalysisResponse);
  rpc CompareUniversities(CompareUniversitiesRequest) returns (CompareUniversitiesResponse);
  rpc GetRecommendedUniversities(GetRecommendedUniversitiesRequest) returns (GetRecommendedUniversitiesResponse);
  rpc GetAdmissionAnalysisByID(GetAdmissionAnalysisByIDRequest) returns (GetAdmissionAnalysisByIDResponse);
}

message AnalyzeAdmissionChancesRequest {
  string user_id = 1;
  string university_id = 2;
  float gpa = 3;
  int32 sat_score = 4;
  float ielts_score = 5;
}
message AnalyzeAdmissionChancesResponse {
  float admission_chance_percentage = 1;
  repeated string weak_areas = 2;
  repeated string improvement_suggestions = 3;
  string gap_analysis = 4;
}

message GenerateRoadmapRequest {
  string user_id = 1;
  string target_university_id = 2;
  int32 months_until_application = 3;
}
message GenerateRoadmapResponse {
  repeated RoadmapStep steps = 1;
}
message RoadmapStep {
  string title = 1;
  string description = 2;
  int32 month_number = 3;
  string category = 4;
}

message ReviewEssayRequest {
  string user_id = 1;
  string essay_text = 2;
  string university_name = 3;
  string program_name = 4;
  int32 word_limit = 5;
}
message ReviewEssayResponse {
  float grammar_score = 1;
  float coherence_score = 2;
  float uniqueness_score = 3;
  float relevance_score = 4;
  repeated string improvement_suggestions = 5;
}

message MatchGrantsRequest {
  string user_id = 1;
  float gpa = 2;
  string country = 3;
  repeated string achievements = 4;
}
message MatchGrantsResponse {
  repeated string matched_grant_ids = 1;
}

message GetAnalysisHistoryRequest { string user_id = 1; }
message GetAnalysisHistoryResponse {
  repeated string analysis_ids = 1;
}

message GetRoadmapByUserIDRequest { string user_id = 1; }
message GetRoadmapByUserIDResponse {
  string roadmap_id = 1;
  repeated RoadmapStep steps = 2;
}

message GetEssayReviewsByUserIDRequest { string user_id = 1; }
message GetEssayReviewsByUserIDResponse {
  repeated string review_ids = 1;
}

message GetEssayReviewByIDRequest { string review_id = 1; }
message GetEssayReviewByIDResponse {
  string review_id = 1;
  string essay_text = 2;
  float grammar_score = 3;
  float coherence_score = 4;
}

message DeleteAnalysisRequest { string analysis_id = 1; }
message DeleteAnalysisResponse { bool success = 1; }

message CompareUniversitiesRequest {
  string university_id_one = 1;
  string university_id_two = 2;
}
message CompareUniversitiesResponse {
  string comparison_result = 1;
  float chance_one = 2;
  float chance_two = 3;
}

message GetRecommendedUniversitiesRequest {
  string user_id = 1;
  float gpa = 2;
}
message GetRecommendedUniversitiesResponse {
  repeated string university_ids = 1;
}

message GetAdmissionAnalysisByIDRequest { string analysis_id = 1; }
message GetAdmissionAnalysisByIDResponse {
  string analysis_id = 1;
  float admission_chance_percentage = 2;
  string gap_analysis = 3;
}